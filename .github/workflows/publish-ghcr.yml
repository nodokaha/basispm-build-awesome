name: Build and publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-compose.yml
      - .dockerignore
      - .github/workflows/publish-ghcr.yml
  workflow_dispatch:
    inputs:
      basis_ref:
        description: "Basis repository branch, tag, or commit to build"
        required: true
        default: "developer"
        type: string
      image_tag:
        description: "Additional image tag (latest is also published)"
        required: true
        default: "manual"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASIS_REF=${{ github.event_name == 'workflow_dispatch' && inputs.basis_ref || 'developer' }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
